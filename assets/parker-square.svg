<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Parker Square, an almost-magic square of squares</title>
  <desc id="desc">A three by three square containing 29 squared, 1 squared, 47 squared; 41 squared, 37 squared, 1 squared; and 23 squared, 41 squared, 29 squared. Seven lines sum to 3051, while one diagonal sums to 4107. Repeated entries are marked.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cell { fill: #111c2e; stroke: #40506a; stroke-width: 2; }
      .value { fill: #f8fafc; font-size: 54px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .sum { fill: #6ee7b7; font-size: 30px; font-weight: 700; }
      .bad { fill: #fb7185; }
      .muted { fill: #94a3b8; }
      .repeat { fill: none; stroke: #fbbf24; stroke-width: 4; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#background)"/>

  <g class="sans">
    <text x="64" y="72" fill="#f8fafc" font-size="38" font-weight="800">THE PARKER SQUARE</text>
    <text x="64" y="108" class="muted" font-size="21">Seven line sums agree. Distinctness and one diagonal politely decline.</text>
  </g>

  <g filter="url(#shadow)" transform="translate(92 150)">
    <rect class="cell" x="0" y="0" width="170" height="150" rx="12"/>
    <rect class="cell" x="174" y="0" width="170" height="150" rx="12"/>
    <rect class="cell" x="348" y="0" width="170" height="150" rx="12"/>
    <rect class="cell" x="0" y="154" width="170" height="150" rx="12"/>
    <rect class="cell" x="174" y="154" width="170" height="150" rx="12"/>
    <rect class="cell" x="348" y="154" width="170" height="150" rx="12"/>
    <rect class="cell" x="0" y="308" width="170" height="150" rx="12"/>
    <rect class="cell" x="174" y="308" width="170" height="150" rx="12"/>
    <rect class="cell" x="348" y="308" width="170" height="150" rx="12"/>

    <g class="mono value">
      <text x="85" y="77">29²</text>
      <text x="259" y="77">1²</text>
      <text x="433" y="77">47²</text>
      <text x="85" y="231">41²</text>
      <text x="259" y="231">37²</text>
      <text x="433" y="231">1²</text>
      <text x="85" y="385">23²</text>
      <text x="259" y="385">41²</text>
      <text x="433" y="385">29²</text>
    </g>

    <rect class="repeat" x="16" y="16" width="138" height="118" rx="10"/>
    <rect class="repeat" x="364" y="324" width="138" height="118" rx="10"/>
    <rect class="repeat" x="190" y="16" width="138" height="118" rx="10"/>
    <rect class="repeat" x="364" y="170" width="138" height="118" rx="10"/>
    <rect class="repeat" x="16" y="170" width="138" height="118" rx="10"/>
    <rect class="repeat" x="190" y="324" width="138" height="118" rx="10"/>

    <path d="M 20 20 L 498 438" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 498 20 L 20 438" stroke="#fb7185" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g class="sans sum">
    <text x="650" y="238">3051  ✓</text>
    <text x="650" y="392">3051  ✓</text>
    <text x="650" y="546">3051  ✓</text>
    <text x="155" y="650" text-anchor="middle">3051  ✓</text>
    <text x="329" y="650" text-anchor="middle">3051  ✓</text>
    <text x="503" y="650" text-anchor="middle">3051  ✓</text>
    <text x="835" y="236">main diagonal: 3051  ✓</text>
    <text x="835" y="292" class="bad">other diagonal: 4107  ✕</text>
  </g>

  <g class="sans">
    <rect x="805" y="340" width="326" height="170" rx="18" fill="#111c2e" stroke="#40506a" stroke-width="2"/>
    <text x="835" y="386" fill="#fbbf24" font-size="23" font-weight="800">REPEATED SQUARES</text>
    <text x="835" y="430" fill="#f8fafc" font-size="29" font-weight="700">1² · 29² · 41²</text>
    <text x="835" y="472" class="muted" font-size="19">Yellow outlines mark both copies.</text>
  </g>

  <line x1="64" y1="702" x2="1136" y2="702" stroke="#334155" stroke-width="2"/>
  <text x="64" y="748" class="sans" fill="#cbd5e1" font-size="24">A mascot for trying anyway — and for checking the eighth line.</text>
</svg>
