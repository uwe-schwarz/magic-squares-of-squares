name: Export p2qr classes

on:
  push:
    branches:
      - research/prime-power-rigidity
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Export the 16 unresolved classes
        run: python3 research/independent-2026-audit/coupled_identity_model.py --pretty > classes.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2qr-classes
          path: classes.json
          retention-days: 1
